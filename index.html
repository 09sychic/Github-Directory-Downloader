<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Github Directory Downloader v0.2.0 // GLASS_ULTRA</title>
  <meta name="description" content="Ultra-fast multi-platform directory extraction with glassmorphism UI.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Syne:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      /* Tech Palette - Violet Core Shift */
      --bg: #030008;
      --ink: #f5f0ff;
      
      --bg-panel: rgba(15, 5, 30, 0.45); /* Refractive Glass Base */
      --bg-panel-hover: rgba(25, 10, 50, 0.55);
      
      --primary: #a855f7;
      --primary-hover: #c084fc;
      --primary-glow: rgba(168, 85, 247, 0.4);
      
      --accent: #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.4);
      
      --success: #00ff41; 
      --error: #ff003c;
      --warning: #f59e0b;
      
      --text-main: var(--ink);
      --text-muted: #94a3b8;
      --text-dim: #4b5563;
      
      --border: rgba(168, 85, 247, 0.2);
      --border-luminous: rgba(168, 85, 247, 0.4);
      
      --radius: 8px;
      
      --font-sans: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --font-intel: 'Inter', sans-serif;
      
      --glass: blur(25px) saturate(200%);
      --ease-elastic: cubic-bezier(0.19, 1, 0.22, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-mono);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Layout Wrapper */
    .main-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
      width: 100%;
      max-width: 1350px;
      margin: 0 auto;
      padding: 40px 20px;
      z-index: 10;
      position: relative;
    }

    /* Main Container */
    .app-container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
    }

    /* Intel Container (Side) */
    .intel-container {
      width: 420px;
      flex-shrink: 0;
      font-family: var(--font-intel);
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.5s ease-out;
    }

    .intel-container.hidden { display: none; }

    .intel-container .card {
      padding: 0;
      height: fit-content;
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 40px;
    }

    .intel-container .auto-intel-header {
      padding: 20px 24px 12px;
      margin-bottom: 0;
    }

    .intel-container .readme-box {
      max-height: none;
      flex: 1;
      overflow-y: auto;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 12px 24px 24px;
      font-size: 0.9rem;
    }

    .intel-container .readme-box h1, 
    .intel-container .readme-box h2,
    .intel-container .readme-box h3 {
      font-family: var(--font-intel);
      font-weight: 700;
    }

    .intel-container .markdown-content {
      font-family: var(--font-intel);
    }

    /* Tech Grid Background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(168, 85, 247, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: -2;
    }

    /* Pulsing Radial Glow */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(124, 58, 237, 0.05) 0%, transparent 70%);
      z-index: -1;
      pointer-events: none;
      animation: pulseGlow 10s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      from { opacity: 0.3; transform: scale(1); }
      to { opacity: 0.6; transform: scale(1.1); }
    }

    #matrixRain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -3;
      opacity: 0.4;
      pointer-events: none;
    }

    /* Glassmorphism Cards */
    .card {
      background: var(--bg-panel);
      backdrop-filter: var(--glass);
      -webkit-backdrop-filter: var(--glass);
      border: 1px solid var(--border);
      border-top: 1px solid var(--border-luminous);
      border-left: 1px solid var(--border-luminous);
      border-radius: var(--radius);
      padding: 24px;
      transition: all 0.4s var(--ease-elastic);
      position: relative;
      box-shadow: 
        0 10px 40px rgba(0, 0, 0, 0.4),
        inset 0 0 20px rgba(168, 85, 247, 0.05);
      overflow: hidden;
    }
    
    .card:hover {
      border-color: var(--border-luminous);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      transform: translateY(-2px);
    }

    /* Reflection Highlight */
    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(255,255,255,0.03) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Recent History Bar */
    .history-chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .history-chip {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 0.7rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .history-chip:hover {
      background: var(--primary-glow);
      color: white;
      border-color: var(--primary);
    }

    /* Toggle Switch Styles */
    .toggle-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    
    .toggle {
      width: 36px;
      height: 18px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      position: relative;
      transition: 0.3s;
      border: 1px solid var(--border);
    }
    
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background: var(--text-muted);
      border-radius: 50%;
      transition: 0.3s cubic-bezier(0.19, 1, 0.22, 1);
    }
    
    .toggle-wrapper.active .toggle {
      background: var(--primary);
      border-color: var(--primary);
    }
    
    .toggle-wrapper.active .toggle::after {
      transform: translateX(18px);
      background: white;
    }
    
    .toggle-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-weight: 500;
    }

    .toggle-wrapper.active .toggle-label {
      color: var(--primary);
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 10px;
    }
    
    h1 {
      font-size: clamp(1.5rem, 6vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: white;
      margin-bottom: 4px;
      line-height: 1.2;
      text-shadow: 0 0 30px var(--primary-glow);
    }
    
    .tagline {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      backdrop-filter: blur(10px);
    }

    /* Form Elements */
    .input-group {
      position: relative;
      margin-bottom: 12px;
      flex: 1;
    }
    
    input, select {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      padding-left: 44px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-main);
      transition: all 0.3s ease;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
      background: rgba(0, 0, 0, 0.6);
    }
    
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s;
    }
    
    input:focus ~ .input-icon {
      color: var(--primary);
    }

    .flex-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .flex-center { align-items: center; }
    .flex-between { justify-content: space-between; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s var(--ease-elastic);
      border: none;
      font-family: var(--font-sans);
      white-space: nowrap;
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 15px var(--primary-glow);
    }
    
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px var(--primary-glow);
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--primary);
    }
    
    .btn-icon { padding: 10px; }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

    /* Tree View */
    .tree-card { display: flex; flex-direction: column; gap: 16px; }
    .tree-header { padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    
    .tree-view {
      max-height: 500px;
      overflow-y: auto;
      padding-right: 8px;
      font-family: var(--font-mono);
    }
    
    .tree-node { transition: 0.2s; }
    
    .tree-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
      user-select: none;
      transition: color 0.2s;
      border-radius: 4px;
    }
    
    .tree-item:hover { 
      color: var(--text-main);
      background: rgba(255,255,255,0.03);
    }
    
    .tree-content {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex: 1;
      overflow: hidden;
    }
    
    .tree-content span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .tree-children {
      margin-left: 20px;
      border-left: 1px solid var(--border);
      padding-left: 12px;
      display: none;
    }
    .tree-children.expanded { display: block; animation: slideDown 0.2s ease-out; }
    
    .checkbox {
      width: 18px;
      height: 18px;
      border: 1px solid var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .checkbox.checked { background: var(--primary); border-color: var(--primary); }
    .checkbox.partial { background: var(--text-dim); border-color: var(--text-dim); }
    .checkbox svg { width: 14px; height: 14px; color: white; display: none; }
    .checkbox.checked svg, .checkbox.partial svg { display: block; }

    /* File Actions */
    .file-actions { display: none; gap: 6px; }
    .tree-item:hover .file-actions { display: flex; }
    .action-btn { 
      background: none; border: none; color: var(--text-dim); 
      cursor: pointer; padding: 2px; border-radius: 4px; 
    }
    .action-btn:hover { color: var(--primary); background: rgba(255,255,255,0.05); }

    /* Charts & Stats */
    .stats-grid { 
      display: grid; 
      grid-template-columns: 1fr 320px; 
      gap: 20px;
      margin-top: 12px;
      align-items: start;
    }
    @media (max-width: 800px) { .stats-grid { grid-template-columns: 1fr; } }
    
    .intel-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: sticky;
      top: 20px;
    }

    .readme-box {
      max-height: 500px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      font-size: 0.85rem;
      box-shadow: inset 0 0 30px rgba(168, 85, 247, 0.05);
    }

    .readme-box h1, .readme-box h2 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .auto-intel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--primary);
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 0.75rem;
    }

    .chart-container {
      height: 180px;
      display: flex;
      justify-content: center;
    }

    /* Toggle & Slider */
    .control-group { margin-top: 12px; }
    .label-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 100px;
      outline: none;
      padding: 0;
      border: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--primary);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px var(--primary);
    }

    /* Terminal */
    .terminal {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      height: 150px;
      overflow-y: auto;
      color: #33ff00;
      border: 1px solid rgba(0, 255, 65, 0.1);
      margin-top: 16px;
      display: none;
      box-shadow: inset 0 0 20px rgba(0,255,0,0.05);
    }
    .terminal.visible { display: block; }
    .log-line { margin-bottom: 2px; opacity: 0; animation: slideIn 0.2s forwards; }
    .log-error { color: var(--error); }
    .log-warn { color: var(--warning); }
    .log-matrix { text-shadow: 0 0 5px #33ff00; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(15px);
      z-index: 10000;
      display: none;
      place-items: center;
      padding: 20px;
    }
    .modal-overlay.active { display: grid; }
    
    .modal-content {
      background: var(--bg-panel);
      backdrop-filter: var(--glass);
      border: 1px solid var(--border-luminous);
      border-radius: var(--radius);
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 30px 100px rgba(0,0,0,0.8);
    }
    
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .modal-body {
      flex: 1;
      overflow: auto;
      padding: 20px;
    }
    
    pre[class*="language-"] { margin: 0; border-radius: 0; background: transparent !important; }
    .markdown-content { font-family: var(--font-sans); color: var(--ink); line-height: 1.6; }
    .markdown-content h1, .markdown-content h2, .markdown-content h3 { margin-top: 24px; margin-bottom: 16px; color: var(--primary); }
    .markdown-content p { margin-bottom: 16px; }
    .markdown-content code { background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; font-family: var(--font-mono); }

    /* Progress */
    .progress-wrapper { margin-top: 16px; display: none; }
    .progress-wrapper.visible { display: block; }
    .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 100px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); width: 0%; transition: width 0.3s linear; box-shadow: 0 0 15px var(--primary); }

    /* Keyframes */
    @keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.2); border-radius: 100px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.4); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <canvas id="matrixRain"></canvas>

  <div class="main-wrapper">
    <div class="app-container">
      <header>
        <div class="badge">
          <i data-lucide="shield-check" size="14"></i>
          <span id="platformIndicator">AUTO_DETECT_PROTOCOL</span>
        </div>
        <h1>Github Directory Downloader <span style="font-size: 0.8rem; vertical-align: middle; opacity: 0.5;">v0.2.0</span></h1>
        <p class="tagline">Ultra-fast multi-platform directory extraction.</p>
      </header>

    <!-- Phase 1: Input -->
    <div class="card">
      <div class="flex-row">
        <div class="input-group">
          <input type="text" id="urlInput" placeholder="Paste GitHub or GitLab URL..." spellcheck="false" autocomplete="off">
          <i data-lucide="link" class="input-icon"></i>
        </div>
        <button id="fetchBtn" class="btn btn-primary">
          <i data-lucide="search"></i>
          SCAN
        </button>
      </div>
      
      <div class="flex-row mt-4" style="gap: 20px;">
        <div class="toggle-wrapper" id="authToggle">
          <div class="toggle"></div>
          <span class="toggle-label">Private Port (PAT)</span>
        </div>
        <div class="toggle-wrapper" id="turboToggle">
          <div class="toggle"></div>
          <span class="toggle-label">Turbo Mode⚡</span>
        </div>
        <div id="branchGroup" class="input-group hidden" style="margin-bottom: 0; max-width: 200px;">
          <select id="branchSelect"></select>
          <i data-lucide="git-branch" class="input-icon"></i>
        </div>
      </div>

      <div id="patSection" class="input-group hidden" style="margin-top: 16px;">
        <div class="flex-row" style="width: 100%;">
          <div style="flex: 1; position: relative;">
            <input type="password" id="patInput" placeholder="Auth Token (ghp_...)" autocomplete="off">
            <i data-lucide="key" class="input-icon"></i>
          </div>
          <button id="genTokenBtn" class="btn btn-secondary btn-sm" style="height: 44px;">
            <i data-lucide="external-link"></i>
            GEN_KEY
          </button>
        </div>
      </div>

      <div id="historyContainer" class="history-chips"></div>
    </div>

    <!-- Phase 2: Tree & Analysis -->
    <div id="treeCard" class="card hidden tree-card">
      <div class="tree-header">
        <div class="flex-row flex-between flex-center">
          <div class="flex-row flex-center">
            <div class="stat-item">
              <span id="totalFiles" class="stat-value">0</span> Files
            </div>
            <div class="stat-item" style="margin-left: 12px;">
              <span id="selectedFiles" class="stat-value">0</span> Selected
            </div>
            <div class="stat-item" style="margin-left: 12px; color: var(--success); font-size: 0.75rem;">
              <span id="totalSize">0 KB</span>
            </div>
          </div>
          <div class="flex-row">
            <button id="selectAllBtn" class="btn btn-sm btn-secondary">ALL</button>
            <button id="selectNoneBtn" class="btn btn-sm btn-secondary">NONE</button>
          </div>
        </div>

        <div class="flex-row mt-4">
          <div class="input-group" style="margin-bottom: 0;">
            <input type="text" id="searchInput" placeholder="Filter files (e.g. .js, src/)...">
            <i data-lucide="filter" class="input-icon"></i>
          </div>
          <div class="input-group" style="margin-bottom: 0;">
            <input type="text" id="excludeInput" placeholder="Exclude (e.g. node_modules, .test.js)">
            <i data-lucide="eye-off" class="input-icon"></i>
          </div>
        </div>
      </div>

      <div class="stats-grid" id="statsGrid">
        <div id="treeView" class="tree-view"></div>
        
        <div class="intel-panel">

          <div class="control-group">

      <div class="progress-wrapper" id="progressWrapper">
        <div class="status-text">
          <span id="statusMessage">Awaiting command...</span>
          <span id="percentage">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressBar"></div>
        </div>
      </div>
      
      <div class="terminal" id="terminal"></div>

      <button id="downloadBtn" class="btn btn-primary mt-4" style="width: 100%;">
        <i data-lucide="download"></i>
        INITIALIZE DOWNLOAD
      </button>
    </div> <!-- treeCard -->
  </div> <!-- app-container -->

  <!-- Side Intel Container -->
  <div id="autoIntel" class="intel-container hidden">
      <div class="card">
        <div class="auto-intel-header">
          <i data-lucide="info" size="14"></i>
          <span>REPOSITORY_INTEL (README)</span>

        <div id="intelContent" class="readme-box markdown-content"></div>

  <!-- Modal for Code Preview -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalFilename" style="font-family: var(--font-mono); font-size: 0.9rem; color: var(--primary);"></span>
        <button class="btn btn-icon btn-secondary btn-sm" onclick="closeModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body" id="modalBody">
        <pre id="codePre"><code id="codeBlock" class="line-numbers"></code></pre>
        <div id="markdownArea" class="markdown-content hidden"></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // --- FAVICON GENERATION ---
    function generateFavicon() {
      const canvas = document.createElement('canvas');
      canvas.width = 32; canvas.height = 32;
      const ctx = canvas.getContext('2d');
      // Background circle
      ctx.fillStyle = '#a855f7';
      ctx.beginPath(); ctx.arc(16, 16, 16, 0, Math.PI * 2); ctx.fill();
      // Text
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px Syne'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('GD', 16, 16);
      
      const link = document.createElement('link');
      link.rel = 'icon'; link.type = 'image/png'; link.href = canvas.toDataURL();
      document.head.appendChild(link);
    }
    generateFavicon();

    // --- MATRIX RAIN ANIMATION ---
    const canvas = document.getElementById('matrixRain');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
    const fontSize = 16;
    let columns = Math.floor(width / fontSize);
    let drops = [];

    function initDrops() {
      columns = Math.floor(width / fontSize);
      drops = [];
      for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * -100;
      }
    }
    initDrops();

    function drawMatrix() {
      ctx.fillStyle = 'rgba(3, 0, 8, 0.15)'; 
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = '#00ff41'; 
      ctx.font = `bold ${fontSize}px 'DM Mono'`;
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00ff41';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
      ctx.shadowBlur = 0; 
    }

    let lastTime = 0;
    const fps = 15; // SLOW RAIN
    const nextFrame = 1000 / fps;

    function animateMatrix(time) {
      if (time - lastTime >= nextFrame) {
        drawMatrix();
        lastTime = time;
      }
      requestAnimationFrame(animateMatrix);
    }
    requestAnimationFrame(animateMatrix);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initDrops();
    });

    lucide.createIcons();

    // State
    const state = {
      files: [], 
      tree: {},  
      selection: new Set(), 
      repoInfo: null,
      platform: 'GITHUB', 
      isTurbo: false,
      debug: true, // VERBOSE LOGGING ENABLED
      lastSelected: null,
      chart: null,
      cache: new Map(),
      history: JSON.parse(localStorage.getItem('gh_history') || '[]')
    };

    const els = {
      urlInput: document.getElementById('urlInput'),
      patInput: document.getElementById('patInput'),
      patSection: document.getElementById('patSection'),
      authToggle: document.getElementById('authToggle'),
      turboToggle: document.getElementById('turboToggle'),
      platformIndicator: document.getElementById('platformIndicator'),
      genTokenBtn: document.getElementById('genTokenBtn'),
      fetchBtn: document.getElementById('fetchBtn'),
      treeCard: document.getElementById('treeCard'),
      treeView: document.getElementById('treeView'),
      totalFiles: document.getElementById('totalFiles'),
      selectedFiles: document.getElementById('selectedFiles'),
      totalSize: document.getElementById('totalSize'),
      downloadBtn: document.getElementById('downloadBtn'),
      progressWrapper: document.getElementById('progressWrapper'),
      progressBar: document.getElementById('progressBar'),
      statusMessage: document.getElementById('statusMessage'),
      percentage: document.getElementById('percentage'),
      terminal: document.getElementById('terminal'),
      selectAllBtn: document.getElementById('selectAllBtn'),
      selectNoneBtn: document.getElementById('selectNoneBtn'),
      searchInput: document.getElementById('searchInput'),
      excludeInput: document.getElementById('excludeInput'),
      branchGroup: document.getElementById('branchGroup'),
      branchSelect: document.getElementById('branchSelect'),
      compressionRange: document.getElementById('compressionRange'),
      compressionVal: document.getElementById('compressionVal'),
      modal: document.getElementById('previewModal'),
      modalFilename: document.getElementById('modalFilename'),
      codeBlock: document.getElementById('codeBlock'),
      codePre: document.getElementById('codePre'),
      markdownArea: document.getElementById('markdownArea'),
      historyContainer: document.getElementById('historyContainer'),
      autoIntel: document.getElementById('autoIntel'),
      intelContent: document.getElementById('intelContent')
    };

    const savedPat = localStorage.getItem('gh_pat');
    if (savedPat) {
      els.patInput.value = savedPat;
      els.authToggle.classList.add('active');
      els.patSection.classList.remove('hidden');
    }
    renderHistory();

    els.authToggle.addEventListener('click', () => {
      els.authToggle.classList.toggle('active');
      els.patSection.classList.toggle('hidden');
    });

    els.turboToggle.addEventListener('click', () => {
      state.isTurbo = !state.isTurbo;
      els.turboToggle.classList.toggle('active');
      showToast(state.isTurbo ? 'TURBO_CONCURRENCY_ACTIVE' : 'STANDARD_THROTTLE_ACTIVE');
    });

    els.genTokenBtn.addEventListener('click', () => {
      const isGitLab = state.platform === 'GITLAB';
      const name = `${isGitLab ? 'GitLab' : 'GitHub'}Downloader_${Math.random().toString(36).substring(7)}`;
      const url = isGitLab 
        ? `https://gitlab.com/-/profile/personal_access_tokens?name=${name}&scopes=read_api`
        : `https://github.com/settings/tokens/new?description=${name}&scopes=repo`;
      window.open(url, '_blank');
    });

    els.patInput.addEventListener('input', (e) => localStorage.setItem('gh_pat', e.target.value));
    els.fetchBtn.addEventListener('click', () => fetchRepository());
    els.downloadBtn.addEventListener('click', downloadFiles);
    els.compressionRange.addEventListener('input', (e) => els.compressionVal.textContent = e.target.value);

    els.selectAllBtn.addEventListener('click', () => {
      state.files.forEach(f => state.selection.add(f.path));
      syncUI();
    });

    els.selectNoneBtn.addEventListener('click', () => {
      state.selection.clear();
      syncUI();
    });

    els.searchInput.addEventListener('input', () => filterTree());
    els.excludeInput.addEventListener('input', () => filterTree());

    els.branchSelect.addEventListener('change', (e) => {
      if (state.repoInfo) {
        state.repoInfo.branch = e.target.value;
        fetchRepository(true);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault(); els.searchInput.focus();
      }
      if (e.ctrlKey && e.key === 'Enter') fetchRepository();
    });

    function showToast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<i data-lucide="${type === 'success' ? 'check' : 'alert-circle'}" size="18"></i><span>${msg}</span>`;
      document.getElementById('toastContainer').appendChild(el);
      lucide.createIcons();
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 4000);
    }

    function log(msg, type = 'info') {
      const line = document.createElement('div');
      line.className = `log-line log-${type}`;
      if (type === 'matrix') line.classList.add('log-matrix');
      line.textContent = `[${new Date().toLocaleTimeString()}] > ${msg}`;
      els.terminal.appendChild(line);
      els.terminal.scrollTop = els.terminal.scrollHeight;
    }

    function parseUrl(url) {
      try {
        const u = new URL(url);
        const parts = u.pathname.split('/').filter(Boolean);
        if (u.hostname.includes('gitlab.com')) {
          state.platform = 'GITLAB';
          els.platformIndicator.textContent = 'PROTOCOL: GITLAB_V4';
          const dashIdx = parts.indexOf('-');
          const ownerRepo = dashIdx !== -1 ? parts.slice(0, dashIdx) : parts;
          const owner = ownerRepo.slice(0, -1).join('/');
          const repo = ownerRepo[ownerRepo.length - 1];
          const fullPath = ownerRepo.join('/');
          let branch = null, path = '';
          if (dashIdx !== -1 && parts[dashIdx + 1] === 'tree') {
            branch = parts[dashIdx + 2]; path = parts.slice(dashIdx + 3).join('/');
          }
          return { owner, repo, branch, path, fullPath, id: encodeURIComponent(fullPath) };
        } else {
          state.platform = 'GITHUB';
          els.platformIndicator.textContent = 'PROTOCOL: GITHUB_V3';
          if (parts.length < 2) return null;
          const owner = parts[0], repo = parts[1];
          let branch = null, path = '';
          if (parts.length > 3 && parts[2] === 'tree') {
            branch = parts[3]; path = parts.slice(4).join('/');
          }
          return { owner, repo, branch, path };
        }
      } catch { return null; }
    }

    function formatBytes(bytes, decimals = 2) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024; const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function renderHistory() {
      els.historyContainer.innerHTML = '';
      state.history.forEach(item => {
        const chip = document.createElement('div');
        chip.className = 'history-chip';
        chip.innerHTML = `<i data-lucide="clock" size="10"></i> ${item.owner}/${item.repo}`;
        chip.onclick = () => { els.urlInput.value = item.url; fetchRepository(); };
        els.historyContainer.appendChild(chip);
      });
      lucide.createIcons();
    }

    function addToHistory(repo, url) {
      const entry = { owner: repo.owner, repo: repo.repo, url: url };
      state.history = [entry, ...state.history.filter(h => h.url !== url)].slice(0, 5);
      localStorage.setItem('gh_history', JSON.stringify(state.history));
      renderHistory();
    }

    async function fetchRepository(fromBranchSelector = false) {
      const url = els.urlInput.value.trim();
      const pat = els.patInput.value.trim();
      const parsed = parseUrl(url);
      if (!parsed) return showToast('INVALID_PATH_STRING', 'error');
      els.fetchBtn.disabled = true; els.fetchBtn.textContent = 'SCANNING...';
      if (!fromBranchSelector) {
        els.treeCard.classList.add('hidden'); 
        els.branchGroup.classList.add('hidden'); 
        if (els.autoIntel) els.autoIntel.classList.add('hidden');
      }
      state.files = []; state.selection.clear(); els.terminal.innerHTML = '';
      try {
        if (state.platform === 'GITHUB') {
          if (!fromBranchSelector) {
            log('Interrogating GitHub repository...');
            const [repoData, branchData] = await Promise.all([
              apiCall(`/repos/${parsed.owner}/${parsed.repo}`, pat),
              apiCall(`/repos/${parsed.owner}/${parsed.repo}/branches`, pat)
            ]);
            parsed.branch = parsed.branch || repoData.default_branch;
            state.repoInfo = parsed;
            els.branchSelect.innerHTML = branchData.map(b => `<option value="${b.name}" ${b.name === parsed.branch ? 'selected' : ''}>${b.name}</option>`).join('');
            els.branchGroup.classList.remove('hidden');
            addToHistory(parsed, url);
          }
          const cacheKey = `gh:${parsed.owner}/${parsed.repo}/${parsed.branch}`;
          let treeData = state.cache.get(cacheKey);
          if (!treeData) {
            log(`Fetching recursive GitHub tree...`);
            treeData = await apiCall(`/repos/${parsed.owner}/${parsed.repo}/git/trees/${parsed.branch}?recursive=1`, pat);
            state.cache.set(cacheKey, treeData);
          }
          const prefix = parsed.path ? parsed.path + '/' : '';
          state.files = treeData.tree
            .filter(item => item.type === 'blob' && (!parsed.path || item.path.startsWith(prefix) || item.path === parsed.path))
            .map(item => ({ path: item.path, size: item.size, relPath: parsed.path ? item.path.replace(prefix, '') : item.path, ext: item.path.split('.').pop().toLowerCase() }));
        } else {
          if (!fromBranchSelector) {
            log('Interrogating GitLab project...');
            const [projectData, branchData] = await Promise.all([
              apiCall(`/projects/${parsed.id}`, pat),
              apiCall(`/projects/${parsed.id}/repository/branches`, pat)
            ]);
            parsed.branch = parsed.branch || projectData.default_branch;
            state.repoInfo = parsed;
            els.branchSelect.innerHTML = branchData.map(b => `<option value="${b.name}" ${b.name === parsed.branch ? 'selected' : ''}>${b.name}</option>`).join('');
            els.branchGroup.classList.remove('hidden');
            addToHistory(parsed, url);
          }
          log(`Fetching GitLab repository tree...`);
          const treeData = await apiCall(`/projects/${parsed.id}/repository/tree?recursive=true&per_page=100&ref=${parsed.branch}${parsed.path ? `&path=${parsed.path}` : ''}`, pat);
          state.files = treeData.filter(item => item.type === 'blob').map(item => ({ path: item.path, size: 0, relPath: parsed.path ? item.path.replace(parsed.path + '/', '') : item.path, ext: item.path.split('.').pop().toLowerCase() }));
        }
        if (state.files.length === 0) throw new Error('EMPTY_DIRECTORY_DETECTED');
        log(`Mapping ${state.files.length} unique data nodes.`);
        state.tree = buildTreeStructure(state.files);
        renderTree(state.tree, els.treeView);
        state.files.forEach(f => state.selection.add(f.path));
        syncUI();
        
        // AUTO INTEL LOAD (Aggressive search)
        if (state.debug) console.warn('DEBUG: INITIATING_INTEL_DISCOVERY');
        let readmeFile = null;
        const readmeRegex = /^readme(\.md|\.txt|\.rst)?$/i;

        if (state.platform === 'GITHUB') {
          const cacheKey = `gh:${parsed.owner}/${parsed.repo}/${parsed.branch}`;
          const treeObj = state.cache.get(cacheKey);
          if (state.debug) console.warn('DEBUG: GITHUB_TREE_LOOKUP', treeObj);
          const fullTree = treeObj.tree;
          readmeFile = fullTree.find(f => readmeRegex.test(f.path)) || 
                       fullTree.find(f => f.path.toLowerCase().endsWith('/readme.md'));
        } else {
          if (state.debug) console.warn('DEBUG: GITLAB_FILE_LOOKUP', state.files);
          readmeFile = state.files.find(f => readmeRegex.test(f.path)) ||
                       state.files.find(f => f.path.toLowerCase().endsWith('/readme.md'));
          
          if (!readmeFile && parsed.path) {
            log('Initiating deep intel scan for root README...');
            try {
              const rootTree = await apiCall(`/projects/${parsed.id}/repository/tree?per_page=50&ref=${parsed.branch}`, pat);
              if (state.debug) console.warn('DEBUG: GITLAB_ROOT_TREE', rootTree);
              readmeFile = rootTree.find(item => readmeRegex.test(item.path));
            } catch (e) {
              log('Deep scan failed: ' + e.message, 'error');
            }
          }
        }

        if (readmeFile) {
          if (state.debug) console.warn('DEBUG: README_TARGET_ACQUIRED', readmeFile);
          log(`Found intellectual property: ${readmeFile.path}`);
          try {
            const content = await fetchFileContent(readmeFile.path, true);
            const text = await content.text();
            if (state.debug) console.warn('DEBUG: README_BUFFER_READ', text.substring(0, 100) + '...');
            
            if (typeof marked !== 'undefined') {
              const renderer = marked.parse || marked;
              if (state.debug) console.warn('DEBUG: MARKDOWN_RENDERER_TYPE', typeof renderer);
              els.intelContent.innerHTML = renderer(text);
              
              if (els.autoIntel) {
                els.autoIntel.classList.remove('hidden');
                if (state.debug) console.warn('DEBUG: AUTO_INTEL_DISPLAY_TRIGGERED');
              } else {
                console.error('DEBUG: AUTO_INTEL_ELEMENT_NULL');
              }
              
              lucide.createIcons(); 
              log('Intel decryption successful.', 'success');
            } else {
              throw new Error('MARKDOWN_ENGINE_OFFLINE');
            }
          } catch (e) {
            log('INTEL_EXTRACTION_FAILED: ' + e.message, 'error');
            if (state.debug) console.error('DEBUG: INTEL_CRASH', e);
          }
        } else {
          log('No repository intel (README) detected.', 'warn');
          if (state.debug) console.warn('DEBUG: README_NOT_FOUND_IN_TREE');
        }

        els.treeCard.classList.remove('hidden');
        els.fetchBtn.textContent = 'SCAN'; els.fetchBtn.disabled = false;
        els.treeCard.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        showToast(err.message, 'error'); els.fetchBtn.disabled = false; els.fetchBtn.textContent = 'SCAN';
      }
    }

    async function apiCall(endpoint, pat) {
      const isGitLab = state.platform === 'GITLAB';
      const baseUrl = isGitLab ? 'https://gitlab.com/api/v4' : 'https://api.github.com';
      const headers = isGitLab ? {} : { 'Accept': 'application/vnd.github.v3+json' };
      if (pat) {
        if (isGitLab) headers['PRIVATE-TOKEN'] = pat;
        else headers['Authorization'] = `Bearer ${pat}`;
      }
      const res = await fetch(`${baseUrl}${endpoint}`, { headers });
      if (!res.ok) throw new Error(`API_ERROR: ${res.status}`);
      return res.json();
    }

    function buildTreeStructure(files) {
      const root = {};
      files.forEach(file => {
        const rel = state.repoInfo.path ? file.path.replace(state.repoInfo.path + '/', '') : file.path;
        const parts = rel.split('/');
        let cur = root;
        parts.forEach((p, i) => {
          if (!cur[p]) { cur[p] = { _name: p, _path: file.path, _type: i === parts.length - 1 ? 'file' : 'dir', _children: {} }; }
          if (i < parts.length - 1) {
            const dp = parts.slice(0, i+1).join('/');
            cur[p]._path = state.repoInfo.path ? state.repoInfo.path + '/' + dp : dp;
          }
          cur = cur[p]._children;
        });
      });
      return root;
    }

    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      const icons = {
        js: 'file-code-2', ts: 'file-code-2', py: 'file-code-2', rb: 'file-code-2',
        html: 'file-text', css: 'file-text', json: 'file-json',
        md: 'file-edit', png: 'file-image', jpg: 'file-image', svg: 'file-image',
        zip: 'file-archive', tar: 'file-archive', pdf: 'file-text'
      };
      return icons[ext] || 'file';
    }

    function renderTree(node, container) {
      container.innerHTML = '';
      const entries = Object.entries(node).sort((a,b) => (a[1]._type === 'dir' && b[1]._type !== 'dir' ? -1 : 1));
      entries.forEach(([key, data]) => {
        const item = document.createElement('div');
        const isDir = data._type === 'dir';
        const fullPath = data._path;
        item.className = 'tree-node';
        item.innerHTML = `
          <div class="tree-item" data-path="${fullPath}">
            <div class="checkbox" data-path="${fullPath}" data-type="${data._type}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            <div class="tree-content"><i data-lucide="${isDir ? 'folder' : getFileIcon(key)}" class="${isDir ? 'folder-icon' : 'file-icon'}" size="14"></i><span>${data._name}</span></div>
            ${!isDir ? `<div class="file-actions">
                <button class="action-btn" title="Preview" onclick="previewFile('${fullPath}')"><i data-lucide="eye" size="12"></i></button>
                <button class="action-btn" title="Copy Raw Link" onclick="copyRawLink('${fullPath}')"><i data-lucide="copy" size="12"></i></button>
              </div>` : ''}
          </div>
          ${isDir ? `<div class="tree-children"></div>` : ''}
        `;
        container.appendChild(item); lucide.createIcons();
        const cb = item.querySelector('.checkbox');
        const content = item.querySelector('.tree-content');
        if (isDir) {
          const childContainer = item.querySelector('.tree-children');
          renderTree(data._children, childContainer);
          content.onclick = () => childContainer.classList.toggle('expanded');
        }
        cb.onclick = (e) => { e.stopPropagation(); handleCheckboxClick(fullPath, isDir, e.shiftKey); };
      });
    }

    function handleCheckboxClick(path, isDir, isShift) {
      if (isShift && state.lastSelected) {
        const visibleNodes = Array.from(els.treeView.querySelectorAll('.tree-item:not(.hidden)'));
        const visiblePaths = visibleNodes.map(i => i.dataset.path);
        const idx1 = visiblePaths.indexOf(state.lastSelected); const idx2 = visiblePaths.indexOf(path);
        if (idx1 !== -1 && idx2 !== -1) {
          const range = visiblePaths.slice(Math.min(idx1, idx2), Math.max(idx1, idx2) + 1);
          const targetState = !state.selection.has(path);
          range.forEach(p => {
            const itemMatch = visibleNodes.find(n => n.dataset.path === p);
            if (!itemMatch) return;
            const isD = itemMatch.querySelector('.checkbox').dataset.type === 'dir';
            if (isD) {
              const children = state.files.filter(f => f.path.startsWith(p + '/'));
              children.forEach(c => targetState ? state.selection.add(c.path) : state.selection.delete(c.path));
            } else { targetState ? state.selection.add(p) : state.selection.delete(p); }
          });
        }
      } else {
        if (isDir) {
          const children = state.files.filter(f => f.path.startsWith(path + '/'));
          const allSel = children.every(f => state.selection.has(f.path));
          children.forEach(f => allSel ? state.selection.delete(f.path) : state.selection.add(f.path));
        } else { state.selection.has(path) ? state.selection.delete(path) : state.selection.add(path); }
      }
      state.lastSelected = path; syncUI();
    }

    function syncUI() {
      document.querySelectorAll('.checkbox').forEach(cb => {
        const p = cb.dataset.path, t = cb.dataset.type;
        if (t === 'file') { cb.classList.toggle('checked', state.selection.has(p)); cb.classList.remove('partial'); }
        else {
          const children = state.files.filter(f => f.path.startsWith(p + '/'));
          const checked = children.filter(f => state.selection.has(f.path)).length;
          cb.classList.remove('checked', 'partial');
          if (checked === children.length && children.length > 0) cb.classList.add('checked');
          else if (checked > 0) cb.classList.add('partial');
        }
      });
      els.totalFiles.textContent = state.files.length;
      els.selectedFiles.textContent = state.selection.size;
      const totalSelSize = state.files.filter(f => state.selection.has(f.path)).reduce((acc, f) => acc + f.size, 0);
      els.totalSize.textContent = formatBytes(totalSelSize);
      updateChart();
    }

    function filterTree() {
      const search = els.searchInput.value.toLowerCase();
      const exclude = els.excludeInput.value.split(',').map(s => s.trim()).filter(Boolean);
      document.querySelectorAll('.tree-item').forEach(item => {
        const p = item.dataset.path.toLowerCase();
        const matchesSearch = !search || p.includes(search);
        const matchesExclude = exclude.some(s => p.includes(s.toLowerCase()));
        item.classList.toggle('hidden', !matchesSearch || matchesExclude);
      });
    }

    function updateChart() {
      const selected = state.files.filter(f => state.selection.has(f.path));
      const types = {};
      selected.forEach(f => types[f.ext] = (types[f.ext] || 0) + f.size);
      const sorted = Object.entries(types).sort((a,b) => b[1] - a[1]).slice(0, 5);
      const data = {
        labels: sorted.map(s => s[0].toUpperCase()),
        datasets: [{
          data: sorted.map(s => s[1]),
          backgroundColor: ['#a855f7', '#7c3aed', '#6366f1', '#4f46e5', '#3730a3'],
          borderWidth: 0
        }]
      };
      if (state.chart) state.chart.destroy();
      state.chart = new Chart(document.getElementById('compositionChart'), {
        type: 'doughnut', data: data,
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' }
      });
    }

    async function previewFile(path) {
      els.modalFilename.textContent = `DECRYPTING: ${path}`;
      els.modal.classList.add('active');
      els.codePre.classList.remove('hidden');
      els.markdownArea.classList.add('hidden');
      els.codeBlock.textContent = 'Deciphering digital signal...';
      try {
        const content = await fetchFileContent(path, true);
        const text = await content.text();
        const ext = path.split('.').pop().toLowerCase();
        if (ext === 'md') {
          els.codePre.classList.add('hidden');
          els.markdownArea.classList.remove('hidden');
          const renderer = marked.parse || marked;
          els.markdownArea.innerHTML = renderer(text);
        } else {
          els.codeBlock.textContent = text;
          els.codeBlock.className = `language-${ext}`;
          Prism.highlightElement(els.codeBlock);
        }
      } catch (e) {
        els.codeBlock.textContent = `ACCESS_DENIED: UNABLE_TO_READ_BUFFER (${e.message})`;
      }
    }

    function closeModal() { els.modal.classList.remove('active'); }

    function copyRawLink(path) {
      const { owner, repo, branch } = state.repoInfo;
      let url = state.platform === 'GITHUB' 
        ? `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`
        : `https://gitlab.com/api/v4/projects/${state.repoInfo.id}/repository/files/${encodeURIComponent(path)}/raw?ref=${branch}`;
      navigator.clipboard.writeText(url).then(() => showToast('CDN_LINK_COPIED'));
    }

    async function downloadFiles() {
      const sel = state.files.filter(f => state.selection.has(f.path));
      if (sel.length === 0) return showToast('NO_TARGETS_SELECTED', 'error');
      els.downloadBtn.disabled = true; els.progressWrapper.classList.add('visible'); els.terminal.classList.add('visible'); els.terminal.innerHTML = '';
      const zip = new JSZip(); const batchSize = state.isTurbo ? 50 : 10; let done = 0;
      log('COMMENCING PROTOCOL: MASS_EXTRACTION', 'matrix');
      for (let i = 0; i < sel.length; i += batchSize) {
        const batch = sel.slice(i, i + batchSize);
        await Promise.all(batch.map(async (f) => {
          try {
            const blob = await fetchFileContent(f.path);
            zip.file(f.relPath, blob); done++; log(`STOLEN: ${f.relPath}`, 'matrix');
          } catch (e) { log(`REJECTED: ${f.relPath}`, 'error'); }
          const pct = Math.round((done / sel.length) * 100);
          els.progressBar.style.width = `${pct}%`; els.percentage.textContent = `${pct}%`;
          els.statusMessage.textContent = `PULLING_DATA [${done}/${sel.length}]...`;
        }));
      }
      log('CONSOLIDATING VOLUMES INTO ARCHIVE...', 'warn');
      const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: parseInt(els.compressionRange.value) } });
      const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `${state.repoInfo.repo}_extracted.zip`; link.click();
      els.downloadBtn.disabled = false; els.statusMessage.textContent = 'EXTRACTION_COMPLETE';
      log('PROTOCOL_FINISHED. TRANSMISSION_SUCCESS.', 'success'); showToast('ARCHIVE_DELIVERED');
    }

    async function apiCall(endpoint, pat) {
      const isGL = state.platform === 'GITLAB';
      const baseUrl = isGL ? 'https://gitlab.com/api/v4' : 'https://api.github.com';
      const headers = isGL ? {} : { 'Accept': 'application/vnd.github.v3+json' };
      if (pat) { if (isGL) headers['PRIVATE-TOKEN'] = pat; else headers['Authorization'] = `Bearer ${pat}`; }
      const res = await fetch(`${baseUrl}${endpoint}`, { headers });
      if (!res.ok) throw new Error(`API_ERROR: ${res.status}`);
      return res.json();
    }

    async function fetchFileContent(path, asBlob = false) {
      const pat = els.patInput.value.trim();
      const { owner, repo, branch, id } = state.repoInfo;
      const isGL = state.platform === 'GITLAB';
      const url = isGL 
        ? `https://gitlab.com/api/v4/projects/${id}/repository/files/${encodeURIComponent(path)}/raw?ref=${branch}`
        : (pat ? `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}` : `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`);
      const headers = pat ? (isGL ? { 'PRIVATE-TOKEN': pat } : { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github.v3.raw' }) : {};
      const res = await fetch(url, { headers });
      if (!res.ok) throw new Error(res.status);
      return res.blob();
    }
  </script>
</body>
